name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentregistry
          POSTGRES_USER: registry
          POSTGRES_PASSWORD: registry
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U registry -d agentregistry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://registry:registry@127.0.0.1:5433/agentregistry
      REGISTRY_SIGNING_KEY: ci-only-signing-key

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      # Cosign testleri ikili yoksa atlanıyor; CI'da atlanmasın.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q -p no:warnings --cov=src/agent_registry --cov-fail-under=80
