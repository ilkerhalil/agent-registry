[project]
name = "agent-registry"
version = "0.2.0"
description = "Agent registry: immutable manifests, signed resolve, append-only audit"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "İlker Halil Türer" }]
requires-python = ">=3.12"
keywords = ["agents", "registry", "governance", "manifest", "audit", "llm"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.7"]

[project.scripts]
agent-registry = "agent_registry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_registry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
