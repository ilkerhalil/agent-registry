services:
  db:
    image: postgres:16-alpine
    container_name: agent-registry-db
    environment:
      POSTGRES_DB: agentregistry
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-registry}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - registry-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d agentregistry"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  registry-data:
